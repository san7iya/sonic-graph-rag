name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: pip install -r requirements-ci.txt
      - name: Run tests
        # test_text_encoder.py runs a real MiniLM inference (needs the model weights); the rest
        # of the suite uses synthetic data and needs no downloaded models, audio or API keys.
        run: python -m pytest tests -q --ignore=tests/test_text_encoder.py
